<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>27 Verifier v4.1 parser lock</title>
<style>
body{font-family:Arial;margin:10px}
button{margin:2px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #ccc;padding:4px;font-size:12px}
.card{border:1px solid #999;padding:6px;margin:4px}
</style>
</head>
<body>

<h3>27번 도구 – CSV 업로드 · X 자동검증 · 카드뷰</h3>

<input type="file" id="fileInput" multiple />
<button onclick="resetDB()">DB 초기화</button>
<button onclick="calcX()">X 리스트</button>
<button onclick="calcWarn()">경고 리스트</button>
<button onclick="copyAll()">전체 복사</button>

<div id="status">DB:0 | X:0 | WARN:0</div>

<hr/>

<div id="cards"></div>

<script>
const LOCK_STANDARD_COLS=[
"Publisher","Title","Sub Title",
"KOR_TITLE","KOR_SUBTITLE",
"ISBN","Price","Currency",
"Pub Date","Pages"
];

let DB=[];
let X_LIST=[];
let WARN_LIST=[];

/* ---------------- CSV PARSER ---------------- */
function parseCSV(text){
  const rows=[];
  let row=[],col="",quote=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c=='"'){quote=!quote;continue;}
    if(c=="," && !quote){row.push(col);col="";continue;}
    if((c=="\n"||c=="\r") && !quote){
      if(col||row.length){row.push(col);rows.push(row);}
      row=[];col="";continue;
    }
    col+=c;
  }
  if(col||row.length){row.push(col);rows.push(row);}
  return rows;
}

/* ---------------- LOAD ---------------- */
document.getElementById("fileInput").onchange=e=>{
  for(const f of e.target.files){
    const r=new FileReader();
    r.onload=()=>{
      const rows=parseCSV(r.result);
      const header=rows[0]||[];
      for(let i=1;i<rows.length;i++){
        const rdata=rows[i];
        if(!rdata.length)continue;
        const obj={};
        LOCK_STANDARD_COLS.forEach(c=>obj[c]="");
        obj.Title=rdata[0]||"";
        obj.ISBN=(rdata[1]||"")+"";
        obj.Price=rdata[2]||"";
        obj.rowId=f.name+"|"+i+"|"+hash(rdata.join("|"));
        DB.push(obj);
      }
      render();
    };
    r.readAsText(f,"utf-8");
  }
};

/* ---------------- HASH ---------------- */
function hash(s){
  let h=0;
  for(let i=0;i<s.length;i++){
    h=((h<<5)-h)+s.charCodeAt(i);
    h|=0;
  }
  return Math.abs(h);
}

/* ---------------- RENDER ---------------- */
function render(){
  const c=document.getElementById("cards");
  c.innerHTML="";
  DB.forEach(d=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=
    "<b>"+(d.Title||"(빈칸)")+"</b><br/>"+
    "ISBN:"+d.ISBN+" / Price:"+d.Price+"<br/>"+
    "ROWID:"+d.rowId;
    c.appendChild(div);
  });
  updateStatus();
}

function updateStatus(){
  document.getElementById("status").innerText=
  "DB:"+DB.length+" | X:"+X_LIST.length+" | WARN:"+WARN_LIST.length;
}

/* ---------------- X CALC ---------------- */
function calcX(){
  X_LIST=[];
  DB.forEach(d=>{
    if(!d.KOR_TITLE)X_LIST.push("KOR_TITLE_BLANK "+d.rowId);
    if(!d.KOR_SUBTITLE)X_LIST.push("KOR_SUBTITLE_BLANK "+d.rowId);
    if(!d.Price)X_LIST.push("PRICE_EMPTY "+d.rowId);
  });
  alert("X:"+X_LIST.length);
  updateStatus();
}

/* ---------------- WARN ---------------- */
function calcWarn(){
  WARN_LIST=[];
  alert("WARN:"+WARN_LIST.length);
}

/* ---------------- COPY ---------------- */
function copyAll(){
  const t=DB.map(d=>d.Title+" | "+d.ISBN).join("\n");
  navigator.clipboard.writeText(t);
  alert("복사됨");
}

/* ---------------- RESET ---------------- */
function resetDB(){
  DB=[];X_LIST=[];WARN_LIST=[];
  render();
}

</script>
</body>
</html>
