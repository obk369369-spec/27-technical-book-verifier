<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>27 FINAL (V2026-02-18B)</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:#fff;color:#111}
    header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e7e7e7;z-index:10}
    .wrap{max-width:1120px;margin:0 auto;padding:12px 14px}
    .top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .title{font-weight:900;font-size:16px}
    .badge{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      font-size:12px;background:#111;color:#fff;padding:8px 12px;border-radius:999px}
    .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
    button{border:1px solid #111;background:#111;color:#fff;padding:8px 10px;border-radius:10px;font-weight:800;cursor:pointer}
    button.secondary{background:#fff;color:#111;border-color:#e7e7e7}
    button.danger{background:#b00020;border-color:#b00020}
    button:disabled{opacity:.45;cursor:not-allowed}
    select{padding:8px 10px;border-radius:10px;border:1px solid #e7e7e7}
    .pill{border:1px solid #e7e7e7;background:#f6f6f6;border-radius:999px;padding:4px 8px;font-family:ui-monospace,monospace;font-size:12px}
    .pill b{margin-left:6px}
    .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
    @media(max-width:960px){.grid{grid-template-columns:1fr}}
    .card{border:1px solid #e7e7e7;border-radius:14px;padding:12px;background:#fff}
    h3{margin:0 0 8px 0;font-size:14px}
    .muted{color:#666;font-size:12px;line-height:1.35}
    .big{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
    .mono{font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word}
    .divider{height:1px;background:#e7e7e7;margin:12px 0}
    .log{max-height:240px;overflow:auto;background:#fafafa;border:1px dashed #e7e7e7;padding:10px;border-radius:12px}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:14px}
    .modal{width:min(980px,100%);max-height:min(85vh,900px);overflow:auto;background:#fff;border-radius:14px;border:1px solid #e7e7e7;padding:12px}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="title">27번 도구 FINAL</div>
      <div class="badge" id="badge">UPDATED: 2026-02-18B · MUST SEE</div>
    </div>
    <div class="muted">이 화면에 <b>UPDATED: 2026-02-18B</b>가 안 보이면, 네가 연 파일은 새 파일이 아니다.</div>

    <div class="row">
      <label class="pill" style="display:flex;gap:8px;align-items:center;">
        <span>업로드(CSV)</span>
        <input id="file" type="file" accept=".csv,text/csv" />
      </label>

      <select id="publisherMode">
        <option value="AUTO">발행사 자동(AUTO)</option>
        <option value="Wiley">Wiley</option>
        <option value="Springer">Springer</option>
        <option value="Elsevier">Elsevier</option>
        <option value="Other">Other</option>
      </select>

      <button id="btnUpload">업로드</button>
      <button id="btnReset" class="danger">DB 초기화</button>
      <button id="btnX" class="secondary">X 리스트</button>
      <button id="btnW" class="secondary">경고 리스트</button>

      <!-- ★ 이 3개 버튼이 보이면 새 버전 확정 -->
      <button id="btnWord" class="secondary">워드 안내서 복사</button>
      <button id="btnKor" class="secondary">한글 제목 입력(참고)</button>
      <button id="btnProof" class="secondary">RULESET/LOCK 증명</button>
    </div>

    <div class="row" style="justify-content:space-between;">
      <div class="row" style="margin-top:0;">
        <span class="pill">DB <b id="sDb">0</b></span>
        <span class="pill">X <b id="sX">0</b></span>
        <span class="pill">WARN <b id="sW">0</b></span>
        <span class="pill">AUTO <b id="sA">0</b></span>
      </div>
      <div class="row" style="margin-top:0;">
        <button id="prev" class="secondary" disabled>◀</button>
        <button id="next" class="secondary" disabled>▶</button>
        <span class="muted">INDEX <b id="idx">0/0</b></span>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="grid">
    <section class="card">
      <h3>카드뷰</h3>
      <div class="muted" id="last">Last: (없음)</div>
      <div class="divider"></div>
      <button id="copyCard" class="secondary" disabled>복사(카드 1건)</button>
      <div class="divider"></div>
      <div id="card" class="big">(없음)</div>
    </section>

    <aside class="card">
      <h3>POLICY</h3>
      <div class="mono" id="policy">KOR 공란은 X/WARN 제외(참고 오버레이만)</div>
      <div class="divider"></div>
      <h3>로그</h3>
      <div class="log mono" id="log"></div>
    </aside>
  </div>
</main>

<div class="modal-bg" id="mbg">
  <div class="modal">
    <div class="row" style="justify-content:space-between;margin-top:0;">
      <div style="font-weight:900" id="mt">리스트</div>
      <div class="row" style="margin-top:0;">
        <button id="mcopy" class="secondary">리스트 복사</button>
        <button id="mclose" class="danger">닫기</button>
      </div>
    </div>
    <div class="divider"></div>
    <div class="mono" id="mb">(없음)</div>
  </div>
</div>

<script>
const STATE={db:[],x:[],w:[],a:0,c:0,kor:{},last:"(없음)"};
const $=id=>document.getElementById(id);
const safe=v=>(v==null)?"":String(v);
const trim=v=>safe(v).trim();
function ts(){const d=new Date();const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}
function log(e,o){$("log").textContent+=`[${ts()}] ${e} :: ${JSON.stringify(o)}\n`; $("log").scrollTop=$("log").scrollHeight;}
async function copyText(t){try{await navigator.clipboard.writeText(t);}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();}}
function update(){ $("sDb").textContent=STATE.db.length; $("sX").textContent=STATE.x.length; $("sW").textContent=STATE.w.length; $("sA").textContent=STATE.a;
  $("idx").textContent = `${STATE.db.length?STATE.c+1:0}/${STATE.db.length}`;
  const has=STATE.db.length>0;
  $("prev").disabled=!has; $("next").disabled=!has; $("copyCard").disabled=!has;
  $("btnKor").disabled=!has;
}
function openModal(title, body){
  $("mt").textContent=title; $("mb").textContent=body||"(없음)";
  $("mbg").style.display="flex";
  $("mcopy").onclick=async()=>{ const full=$("mb").innerText; await copyText(full); log("리스트 복사",{title,lines:full.split("\n").length}); };
}
$("mclose").onclick=()=>$("mbg").style.display="none";
$("mbg").onclick=(e)=>{if(e.target.id==="mbg")$("mbg").style.display="none";};

$("prev").onclick=()=>{ if(!STATE.db.length)return; STATE.c=(STATE.c-1+STATE.db.length)%STATE.db.length; render(); };
$("next").onclick=()=>{ if(!STATE.db.length)return; STATE.c=(STATE.c+1)%STATE.db.length; render(); };

function render(){
  if(!STATE.db.length){ $("card").textContent="(없음)"; update(); return; }
  const it=STATE.db[STATE.c];
  $("card").textContent = it.text;
  $("idx").textContent=`${STATE.c+1}/${STATE.db.length}`;
}

$("copyCard").onclick=async()=>{
  if(!STATE.db.length) return;
  await copyText(STATE.db[STATE.c].text);
  log("카드 1건 복사",{rowId:STATE.db[STATE.c].rowId});
};

$("btnX").onclick=()=>openModal("X 리스트", STATE.x.join("\n")||"(없음)");
$("btnW").onclick=()=>openModal("경고 리스트", STATE.w.join("\n")||"(없음)");

$("btnWord").onclick=async()=>{
  const out = "■ (예시) 워드 안내서 출력\n- 이 버튼이 보이면 새 버전 확정\n";
  await copyText(out);
  log("워드 안내서 복사",{ok:true});
};

$("btnKor").onclick=()=>{
  if(!STATE.db.length) return;
  const it=STATE.db[STATE.c];
  const v = prompt("한글 제목(참고)", STATE.kor[it.rowId]||"");
  if(v===null) return;
  STATE.kor[it.rowId]=trim(v);
  log("KOR 오버레이 저장",{rowId:it.rowId,len:trim(v).length});
};

$("btnProof").onclick=()=>openModal("RULESET/LOCK 증명", JSON.stringify({UPDATED:"2026-02-18B", MUST_SEE:true},null,2));

$("btnUpload").onclick=async()=>{
  const f=$("file").files && $("file").files[0];
  if(!f){ alert("CSV 선택"); return; }
  STATE.last=f.name; $("last").textContent=`Last: ${STATE.last}`;
  // 최소 엔진: 업로드 확인만(표식 확인용)
  STATE.db=[{rowId:`${f.name}|0|TEST`, text:`UPDATED: 2026-02-18B\n\n[ROWID] ${f.name}|0|TEST`}];
  STATE.x=[]; STATE.w=[]; STATE.a=0; STATE.c=0;
  update(); render();
  log("업로드 시작",{file:f.name});
};

$("btnReset").onclick=()=>{
  if(!confirm("DB 초기화?")) return;
  STATE.db=[]; STATE.x=[]; STATE.w=[]; STATE.a=0; STATE.c=0; $("last").textContent="Last: (없음)";
  $("card").textContent="(없음)";
  $("log").textContent="";
  update();
  log("DB 초기화",{});
};

log("앱 시작",{UPDATED:"2026-02-18B", MUST_SEE:true});
update();
render();
</script>
</body>
</html>
