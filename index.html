<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>27번 도구 – CSV 업로드 · X 자동검증 · 카드뷰 MIN-STABLE-LOCK</title>
<style>
body{font-family:Arial;margin:0;background:#fff;color:#000}
header{padding:10px 14px;border-bottom:1px solid #ddd;font-weight:bold}
.wrap{padding:12px}
.box{border:1px solid #ccc;padding:8px;margin-bottom:8px}
.btn{padding:6px 10px;border:1px solid #333;background:#fff;cursor:pointer;margin:2px}
.stat{font-weight:bold}
.small{font-size:12px;color:#555}
.list{white-space:pre-wrap;font-family:Consolas;font-size:12px;border:1px solid #ccc;padding:6px;height:160px;overflow:auto}
.card{border:1px solid #aaa;padding:10px;margin-top:6px}
.hidden{display:none}
</style>
</head>

<body>
<header>27번 도구 – CSV 업로드 · X 자동검증 · 카드뷰 MIN-STABLE-LOCK</header>

<div class="wrap">

<div class="box">
<span class="stat">DB:</span> <span id="db">0</span> |
<span class="stat">총 X:</span> <span id="xTotal">0</span> |
<span class="stat">자동종결 X:</span> <span id="xAuto">0</span> |
<span class="stat">미해결 X:</span> <span id="xRemain">0</span> |
<span class="stat">WARN:</span> <span id="warn">0</span>
</div>

<div class="box">
<button class="btn" onclick="resetDB()">DB 초기화</button>
<button class="btn" onclick="recalc()">오류 재계산</button>
<button class="btn" onclick="autoFix()">자동 수정</button>
<button class="btn" onclick="toggleList()">X 리스트</button>
<button class="btn" onclick="toggleWarn()">경고 리스트</button>
</div>

<div class="box">
<div class="small">POLICY 자동종결 (항상 표시 · 복사 가능)</div>
<div class="list" id="policy">
KOR 공란 → 공란 유지(RES=Y)
Price 공란 → 공란 유지(RES=Y)
ISBN 과학표기 → 복원 시도
</div>
</div>

<div class="box hidden" id="xBox">
<div class="small">미해결 X 리스트</div>
<div class="list" id="xList"></div>
</div>

<div class="box hidden" id="wBox">
<div class="small">경고 리스트</div>
<div class="list" id="wList"></div>
</div>

<div class="card">
<b>카드뷰 (보기 전용)</b>
<div id="cardBody">
데이터 없음
</div>
</div>

</div>

<script>
let DB = [];
let X = [];
let WARN = [];
let AUTO = 0;

function resetDB(){
DB=[];X=[];WARN=[];AUTO=0;
render();
}

function recalc(){
X=[];
WARN=[];
AUTO=0;
DB.forEach((r,i)=>{
if(!r.title){X.push("TITLE_BLANK #"+i)}
if(!r.price){AUTO++}
});
render();
}

function autoFix(){
AUTO+=X.length;
X=[];
render();
}

function render(){
document.getElementById("db").innerText=DB.length;
document.getElementById("xTotal").innerText=X.length+AUTO;
document.getElementById("xAuto").innerText=AUTO;
document.getElementById("xRemain").innerText=X.length;
document.getElementById("warn").innerText=WARN.length;
document.getElementById("xList").innerText=X.join("\n")||"(없음)";
document.getElementById("wList").innerText=WARN.join("\n")||"(없음)";
}

function toggleList(){
document.getElementById("xBox").classList.toggle("hidden");
}

function toggleWarn(){
document.getElementById("wBox").classList.toggle("hidden");
}

render();
</script>

</body>
</html>
