<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>27번 도구 – CSV 업로드 · X 자동검증 · 카드뷰(최소안정)</title>
<style>
body{font-family:Arial, sans-serif;background:#fff;margin:10px}
button{margin:2px 4px;padding:6px 10px}
.panel{border:1px solid #ccc;padding:8px;margin-top:6px}
.hidden{display:none}
.card{border:1px solid #ddd;padding:8px;margin:6px 0}
pre{white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>

<h3>27번 도구 – CSV 업로드 · X 자동검증 · 카드뷰</h3>

<input type="file" id="file" />
<button onclick="resetDB()">DB 초기화</button>

<div class="panel">
<button onclick="showX()">X 리스트</button>
<button onclick="showWarn()">경고 리스트</button>
<button onclick="autoFix()">자동 수정</button>
</div>

<div class="panel">
DB:<span id="dbCnt">0</span> |
X:<span id="xCnt">0</span> |
WARN:<span id="wCnt">0</span>
</div>

<div id="listPanel" class="panel hidden">
<button onclick="copyList()">전체 복사</button>
<pre id="listText"></pre>
</div>

<div id="cards"></div>

<script>
let DB=[];
let X=[];
let WARN=[];

// --- 유틸 ---
function hash(str){
  let h=0; for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0;}
  return Math.abs(h);
}
function makeRowId(file,row,obj){
  return file+"|"+row+"|"+hash(JSON.stringify(obj));
}

// --- CSV 간단 파서 ---
function parseCSV(text){
  return text.split(/\r?\n/).filter(l=>l.trim()).map(l=>{
    const a=l.split(",");
    return {
      Title:a[0]||"",
      KOR_TITLE:a[1]||"",
      ISBN:a[2]||"",
      Price:a[3]||"",
      PubDate:a[4]||""
    };
  });
}

// --- 업로드 ---
document.getElementById('file').addEventListener('change', e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    const rows=parseCSV(ev.target.result);
    rows.forEach((o,i)=>{
      o._ROWID=makeRowId(f.name,i,o);
      DB.push(o);
    });
    recalc();
    renderCards();
  };
  r.readAsText(f);
});

// --- 계산 ---
function recalc(){
  X=[]; WARN=[];
  DB.forEach(r=>{
    if(!r.KOR_TITLE) X.push("KOR_TITLE_BLANK :: "+r._ROWID);
    if(!r.Price) WARN.push("PRICE_EMPTY :: "+r._ROWID);
  });
  document.getElementById('dbCnt').innerText=DB.length;
  document.getElementById('xCnt').innerText=X.length;
  document.getElementById('wCnt').innerText=WARN.length;
}

// --- 리스트 출력 ---
function showX(){
  const p=document.getElementById('listPanel');
  p.classList.remove('hidden');
  document.getElementById('listText').innerText=X.join("\n")||"(없음)";
}
function showWarn(){
  const p=document.getElementById('listPanel');
  p.classList.remove('hidden');
  document.getElementById('listText').innerText=WARN.join("\n")||"(없음)";
}
function copyList(){
  const t=document.getElementById('listText').innerText;
  navigator.clipboard.writeText(t);
}

// --- 자동 수정(최소) ---
function autoFix(){
  DB.forEach(r=>{
    if(!r.KOR_TITLE) r.KOR_TITLE="(빈칸)";
  });
  recalc();
  renderCards();
}

// --- 카드 ---
function renderCards(){
  const d=document.getElementById('cards');
  d.innerHTML="";
  DB.forEach(r=>{
    const c=document.createElement('div');
    c.className="card";
    c.innerHTML=
      "<b>"+r.Title+"</b><br>"+
      r.KOR_TITLE+"<br>"+
      "ISBN:"+r.ISBN+" / Price:"+r.Price+"<br>"+
      "ROWID:"+r._ROWID;
    d.appendChild(c);
  });
}

// --- 초기화 ---
function resetDB(){
  DB=[]; X=[]; WARN=[];
  recalc();
  renderCards();
  document.getElementById('listPanel').classList.add('hidden');
}
</script>
</body>
</html>
