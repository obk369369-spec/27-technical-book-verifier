<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>27번 공학도서 안내 도구 – 안정화 v4 FIX</title>
<style>
body { font-family: Arial; background:#ffffff; margin:0; padding:10px; }
button { margin:2px; }
table { border-collapse:collapse; width:100%; font-size:13px; }
th, td { border:1px solid #ccc; padding:4px; white-space:nowrap; }
th { background:#f5f5f5; position:sticky; top:0; }
.card { border:1px solid #ddd; padding:8px; margin:6px 0; }
.copybtn { float:right; }
</style>
</head>

<body>

<h3>27번 도구 – CSV 업로드 · X 자동검증 · 카드뷰</h3>

<button onclick="copyX()">X 리스트</button>
<button onclick="copyWarn()">경고 리스트</button>
<button onclick="policyToggle()">POLICY</button>

<div id="status"></div>
<div id="cards"></div>

<script>
// ================== LOCK STANDARD ==================
const LOCK_STANDARD_COLS = [
"Publisher","Title","Sub Title","KOR_TITLE","KOR_SUBTITLE",
"ISBN","Price","Currency","Pub Date","Pages"
];

const LOCK_POLICY = {
KOR_EMPTY_IS_X: true,
PRICE_EMPTY_IS_X: true
};

// ================== SAMPLE DATA ==================
let DB = [
{Publisher:"Wiley",Title:"Freedom Teaching",KOR_TITLE:"",KOR_SUBTITLE:"",
ISBN:"9781120000000",Price:"27.95",Currency:"USD","Pub Date":"2024-01-02",Pages:""},
];

// ================== HASH ==================
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i);return Math.abs(h);}
function rowId(r,i){return r.Publisher+"|"+i+"|"+hash(r.Title);}

// ================== VALIDATION ==================
let XLIST=[], WARNLIST=[];

function validate(){
XLIST=[]; WARNLIST=[];
DB.forEach((r,i)=>{
if(LOCK_POLICY.KOR_EMPTY_IS_X && !r.KOR_TITLE)
XLIST.push("KOR_TITLE_BLANK "+rowId(r,i));
if(LOCK_POLICY.KOR_EMPTY_IS_X && !r.KOR_SUBTITLE)
XLIST.push("KOR_SUBTITLE_BLANK "+rowId(r,i));
if(LOCK_POLICY.PRICE_EMPTY_IS_X && !r.Price)
XLIST.push("PRICE_EMPTY "+rowId(r,i));
});
}

// ================== CARD VIEW ==================
function draw(){
validate();
let c=document.getElementById("cards"); c.innerHTML="";
DB.sort((a,b)=>b["Pub Date"].localeCompare(a["Pub Date"]));

DB.forEach((r,i)=>{
let d=document.createElement("div"); d.className="card";
d.innerHTML=`
<button class="copybtn" onclick="copyCard(${i})">복사</button>
<b>${r.Title}</b><br>
(${r.KOR_TITLE||"빈칸"})<br><hr>
발행사:${r.Publisher} / Pages:${r.Pages||"빈칸"} / ISBN:${r.ISBN}<br>
정가:${r.Price||"빈칸"} ${r.Currency}<br>
발행:${r["Pub Date"]}<br>
ROWID:${rowId(r,i)}
`;
c.appendChild(d);
});

document.getElementById("status").innerText=
"DB:"+DB.length+" | X:"+XLIST.length+" | WARN:"+WARNLIST.length;
}

// ================== COPY ==================
function copyCard(i){
let r=DB[i];
navigator.clipboard.writeText(r.Title+" "+r.ISBN);
}
function copyX(){ navigator.clipboard.writeText(XLIST.join("\n")); }
function copyWarn(){ navigator.clipboard.writeText(WARNLIST.join("\n")); }

// ================== POLICY ==================
function policyToggle(){
LOCK_POLICY.KOR_EMPTY_IS_X=!LOCK_POLICY.KOR_EMPTY_IS_X;
draw();
}

// ================== INIT ==================
draw();

</script>
</body>
</html>
