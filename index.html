<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>27 Technical Book Verifier</title>

<style>
body{
  font-family: Arial, Helvetica, sans-serif;
  margin:0;
  padding:0;
}

.header{
  padding:8px 12px;
  background:#f5f5f5;
  border-bottom:1px solid #ddd;
  font-size:13px;
}

.container{
  display:flex;
  height:calc(100vh - 40px);
}

/* ===== 왼쪽 패널 ===== */
.left{
  width:300px;
  border-right:1px solid #ddd;
  padding:10px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
}

/* ===== 카테고리 영역 ===== */
.category-box{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  border:1px solid #eee;
  border-radius:8px;
  padding:6px;
  background:#fafafa;
}

/* 스크롤 항상 보이게 */
.category-box::-webkit-scrollbar{
  width:8px;
}
.category-box::-webkit-scrollbar-thumb{
  background:#ccc;
  border-radius:4px;
}

.cat-item{
  display:flex;
  justify-content:space-between;
  padding:6px 10px;
  margin-bottom:4px;
  border-radius:6px;
  cursor:pointer;
}

.cat-item:hover{
  background:#ececec;
}

.cat-count{
  color:#666;
  font-size:12px;
}

/* ===== 오른쪽 영역 ===== */
.right{
  flex:1;
  padding:10px;
  overflow:auto;
}

</style>
</head>
<body>

<div class="header">
  HEALTH 2026-02-19A/CAT20_DISPLAY_ONLY · LOCK:ok · ROW:ok · PARSE:ok · PERSIST:ok · CLASSIFY:ok · DUP:ok · SHELL:ok
</div>

<div class="container">

  <div class="left">
    <h3>카테고리 (상위 20 고정)</h3>
    <div class="category-box" id="categoryList"></div>
  </div>

  <div class="right">
    <h3>데이터 영역</h3>
    <div id="dataArea"></div>
  </div>

</div>

<script>

/* ===== 기존 records 유지 ===== */
const records = window.records || [];

/* ===== 카테고리 집계 ===== */
function buildCategoryCounts(data){
  const map = {};
  data.forEach(r=>{
    const c = r.category || "미분류";
    if(!map[c]) map[c]=0;
    map[c]++;
  });
  return map;
}

/* ===== 상위 20개 보장 ===== */
function getTop20(map){
  const sorted = Object.entries(map)
    .sort((a,b)=>b[1]-a[1]);

  while(sorted.length < 20){
    sorted.push(["(비어있음)",0]);
  }

  return sorted.slice(0,20);
}

/* ===== 렌더 ===== */
function renderCategories(){
  const container = document.getElementById("categoryList");
  container.innerHTML="";

  const counts = buildCategoryCounts(records);
  const top20 = getTop20(counts);

  top20.forEach(item=>{
    const div = document.createElement("div");
    div.className="cat-item";
    div.innerHTML = `
      <span>${item[0]}</span>
      <span class="cat-count">${item[1]}</span>
    `;
    container.appendChild(div);
  });
}

renderCategories();

</script>

</body>
</html
